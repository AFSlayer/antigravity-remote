<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Device frame</title>
    <style>
      :root {
        --screen-w: 393px;
        --screen-h: 852px;
        --bezel: 11px;
        --screen-radius: 46px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background: transparent;
        padding: 44px 52px 56px;
      }
      .stage {
        position: relative;
        filter: drop-shadow(0 32px 48px rgb(0 0 0 / 0.45))
          drop-shadow(0 4px 10px rgb(0 0 0 / 0.35));
      }
      .device {
        position: relative;
        width: calc(var(--screen-w) + var(--bezel) * 2);
        height: calc(var(--screen-h) + var(--bezel) * 2);
        padding: var(--bezel);
        border-radius: calc(var(--screen-radius) + var(--bezel));
        background: linear-gradient(150deg, #6c6c72 0%, #2c2c31 18%, #4a4a51 46%, #24242a 72%, #5f5f66 100%);
      }
      .device::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: calc(var(--screen-radius) + var(--bezel) - 3px);
        border: 1px solid rgb(255 255 255 / 0.16);
        pointer-events: none;
      }
      .screen {
        position: relative;
        width: var(--screen-w);
        height: var(--screen-h);
        border-radius: var(--screen-radius);
        overflow: hidden;
        background: #000;
      }
      .screen img,
      .screen iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .screen img {
        object-fit: cover;
        object-position: top center;
      }
      .island {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        width: 122px;
        height: 35px;
        border-radius: 18px;
        background: #000;
        z-index: 2;
      }
      .island::after {
        content: "";
        position: absolute;
        top: 50%;
        right: 11px;
        transform: translateY(-50%);
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #2b3348 0%, #0b0d14 70%);
      }
      .button {
        position: absolute;
        width: 3px;
        background: linear-gradient(180deg, #55555c, #2b2b31);
        border-radius: 2px;
      }
      .button.silence {
        left: -3px;
        top: 108px;
        height: 30px;
      }
      .button.up {
        left: -3px;
        top: 164px;
        height: 62px;
      }
      .button.down {
        left: -3px;
        top: 240px;
        height: 62px;
      }
      .button.power {
        right: -3px;
        top: 196px;
        height: 96px;
      }
      .glare {
        position: absolute;
        inset: 0;
        border-radius: var(--screen-radius);
        background: linear-gradient(
          122deg,
          rgb(255 255 255 / 0.1) 0%,
          rgb(255 255 255 / 0.02) 22%,
          transparent 42%
        );
        pointer-events: none;
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="device">
        <span class="button silence"></span>
        <span class="button up"></span>
        <span class="button down"></span>
        <span class="button power"></span>
        <div class="screen" id="screen">
          <span class="island"></span>
          <span class="glare"></span>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const screen = document.getElementById("screen");
      const island = screen.querySelector(".island");

      const src = params.get("src");
      const url = params.get("url");

      if (url) {
        const frame = document.createElement("iframe");
        frame.src = url;
        frame.setAttribute("scrolling", "no");
        screen.insertBefore(frame, island);
      } else if (src) {
        const img = document.createElement("img");
        img.alt = "";
        img.style.objectFit = params.get("fit") || "cover";
        img.src = src;
        screen.insertBefore(img, island);
      }

      if (params.get("bg") === "opaque") {
        document.body.style.background =
          "radial-gradient(120% 80% at 50% -10%, #2a2a33 0%, #0e0e11 62%)";
      }
    </script>
  </body>
</html>
