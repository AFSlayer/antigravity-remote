<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social card</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        gap: 4rem;
        padding: 0 5rem;
        background:
          radial-gradient(70% 120% at 18% -20%, rgb(79 124 255 / 0.22) 0%, transparent 62%),
          radial-gradient(55% 100% at 88% 10%, rgb(168 85 247 / 0.16) 0%, transparent 62%),
          #0e0e11;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .copy {
        flex: 1;
        min-width: 0;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.4rem 0.9rem;
        border: 1px solid #2f2f36;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.04);
        font-size: 0.95rem;
        color: #a1a1aa;
      }
      .badge::before {
        content: "";
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 999px;
        background: #4ade80;
      }
      h1 {
        margin: 1.6rem 0 0;
        font-size: 4.1rem;
        line-height: 1.04;
        letter-spacing: -0.04em;
        font-weight: 680;
      }
      h1 em {
        font-style: normal;
        background: linear-gradient(96deg, #7aa2ff 0%, #c084fc 58%, #f0abfc 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin-top: 1.5rem;
        max-width: 30rem;
        font-size: 1.35rem;
        line-height: 1.5;
        color: #a1a1aa;
      }
      .repo {
        margin-top: 2.2rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 1.1rem;
        color: #71717a;
      }
      .repo img {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 0.45rem;
      }
      .shot {
        flex: 0 0 auto;
        height: 720px;
        margin-bottom: -8rem;
        transform: rotate(-4deg);
        filter: drop-shadow(0 40px 60px rgb(0 0 0 / 0.6));
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <span class="badge">Single binary · Apache-2.0</span>
      <h1>Antigravity,<br /><em>on your phone.</em></h1>
      <p>
        Serves the Antigravity desktop app's own web UI to your devices, behind a
        password.
      </p>
      <div class="repo">
        <img src="../../docs/assets/icon-192.png" alt="" />
        github.com/AFSlayer/antigravity-remote
      </div>
    </div>
    <img class="shot" src="../../docs/assets/hero.png" alt="" />
  </body>
</html>
